{{- if .Values.metrics.serviceMonitor.enabled }}
# Prometheus Operator scrape configs. The API endpoint needs the bearer
# METRICS_TOKEN from the app Secret.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "nardarena.fullname" . }}
  labels:
    {{- include "nardarena.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nardarena.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          regex: game-server
          action: keep
    - port: http
      path: /api/v1/internal/metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.secrets.name }}
          key: METRICS_TOKEN
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          regex: api
          action: keep
{{- end }}
