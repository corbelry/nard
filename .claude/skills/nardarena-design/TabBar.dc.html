<!-- @dsCard group="Game" viewport="390x90" name="TabBar" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:none;padding:8px 8px 26px;display:flex;background:linear-gradient(180deg,rgba(27,18,12,0),#1b120c 30%);border-top:1px solid rgba(201,162,74,.16);font-family:'IBM Plex Sans',sans-serif">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
    <div style="flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{ t.c }}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.d }}"></path></svg>
      <span style="font-size:11px;line-height:12px;font-weight:{{ t.w }}">{{ t.l }}</span>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;tour&quot;,&quot;clan&quot;,&quot;store&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const T = [
  ['home', 'Əsas', 'M4 11l8-7 8 7v9h-5v-6h-6v6H4z'],
  ['tour', 'Turnirlər', 'M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8'],
  ['clan', 'Klan', 'M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z'],
  ['store', 'Mağaza', 'M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2'],
  ['profile', 'Profil', 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1-4 4.5-6 8-6s7 2 8 6']
];
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'home';
    return { tabs: T.map(([k, l, d]) => ({ l, d, c: k === a ? '#E8C468' : 'rgba(243,235,221,.6)', w: k === a ? 600 : 500 })) };
  }
}
</script>
</body>
</html>
