<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg)}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:16px"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;border-radius:min(var(--radius-xs),28px);background:var(--surface);box-shadow:var(--ring-accent)"></div><span style="font:var(--type-mono);font-size:10px;color:var(--text-dim)">radius-xs</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;border-radius:min(var(--radius-s),28px);background:var(--surface);box-shadow:var(--ring-accent)"></div><span style="font:var(--type-mono);font-size:10px;color:var(--text-dim)">radius-s</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;border-radius:min(var(--radius-m),28px);background:var(--surface);box-shadow:var(--ring-accent)"></div><span style="font:var(--type-mono);font-size:10px;color:var(--text-dim)">radius-m</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;border-radius:min(var(--radius-l),28px);background:var(--surface);box-shadow:var(--ring-accent)"></div><span style="font:var(--type-mono);font-size:10px;color:var(--text-dim)">radius-l</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;border-radius:min(var(--radius-xl),28px);background:var(--surface);box-shadow:var(--ring-accent)"></div><span style="font:var(--type-mono);font-size:10px;color:var(--text-dim)">radius-xl</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;border-radius:min(var(--radius-pill),28px);background:var(--surface);box-shadow:var(--ring-accent)"></div><span style="font:var(--type-mono);font-size:10px;color:var(--text-dim)">radius-pill</span></div></div></body></html>
