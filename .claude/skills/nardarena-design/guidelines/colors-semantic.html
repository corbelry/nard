<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg)}*{box-sizing:border-box}</style></head><body><div style="display:flex;flex-wrap:wrap;gap:12px"><div style="display:flex;flex-direction:column;gap:6px;width:92px"><div style="height:56px;border-radius:10px;background:var(--bg);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)"></div><span style="font:var(--type-mono);color:var(--text)">bg</span><span style="font:var(--type-mono);font-size:10px;color:var(--text-dim)">--bg</span></div><div style="display:flex;flex-direction:column;gap:6px;width:92px"><div style="height:56px;border-radius:10px;background:var(--surface-raised);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)"></div><span style="font:var(--type-mono);color:var(--text)">surface-raised</span><span style="font:var(--type-mono);font-size:10px;color:var(--text-dim)">--surface-raised</span></div><div style="display:flex;flex-direction:column;gap:6px;width:92px"><div style="height:56px;border-radius:10px;background:var(--text);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)"></div><span style="font:var(--type-mono);color:var(--text)">text</span><span style="font:var(--type-mono);font-size:10px;color:var(--text-dim)">--text</span></div><div style="display:flex;flex-direction:column;gap:6px;width:92px"><div style="height:56px;border-radius:10px;background:var(--text-dim);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)"></div><span style="font:var(--type-mono);color:var(--text)">text-dim</span><span style="font:var(--type-mono);font-size:10px;color:var(--text-dim)">--text-dim</span></div><div style="display:flex;flex-direction:column;gap:6px;width:92px"><div style="height:56px;border-radius:10px;background:var(--accent);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)"></div><span style="font:var(--type-mono);color:var(--text)">accent</span><span style="font:var(--type-mono);font-size:10px;color:var(--text-dim)">--accent</span></div><div style="display:flex;flex-direction:column;gap:6px;width:92px"><div style="height:56px;border-radius:10px;background:var(--danger-text);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)"></div><span style="font:var(--type-mono);color:var(--text)">danger-text</span><span style="font:var(--type-mono);font-size:10px;color:var(--text-dim)">--danger-text</span></div><div style="display:flex;flex-direction:column;gap:6px;width:92px"><div style="height:56px;border-radius:10px;background:var(--success-text);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)"></div><span style="font:var(--type-mono);color:var(--text)">success-text</span><span style="font:var(--type-mono);font-size:10px;color:var(--text-dim)">--success-text</span></div></div></body></html>
