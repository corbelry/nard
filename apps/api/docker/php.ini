; Production PHP settings on top of php.ini-production (ADR-047).
expose_php = Off

; The code never changes inside a running container: skip the stat calls.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; The API ingress caps bodies at 2 MB.
upload_max_filesize = 2M
post_max_size = 4M
