name: nard_client
description: NardArena mobile client (iOS + Android).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.7.0

dependencies:
  audioplayers: ^6.6.0
  drift: ^2.28.0
  flame: ^1.30.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.4
  go_router: ^17.0.0
  http: ^1.6.0
  intl: ^0.19.0
  lucide_icons: ^0.257.0
  nard_ai: any
  nard_core: any
  nard_protocol: any
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.42
  web_socket_channel: ^3.0.3

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.28.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  sqlite3: ^2.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
  # Fonts: OFL (see assets/fonts/OFL-*.txt). Static instances of the Google
  # Fonts variable files; IBMPlexSansCondensed has no Cyrillic (komur only).
  # The theme's display family is served by Noto Serif (the text cut): the
  # Display cut's hairlines look thin on phone screens (ADR-051).
  fonts:
    - family: NotoSerifDisplay
      fonts:
        - asset: assets/fonts/NotoSerif-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSerif-MediumItalic.ttf
          weight: 500
          style: italic
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexSansCondensed
      fonts:
        - asset: assets/fonts/IBMPlexSansCondensed-SemiBold.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
